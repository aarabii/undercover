name: ✨ Request a Feature
description: Suggest a new feature or improvement for Undercover.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Request
      description: Describe the feature or improvement you'd like to see in Undercover.
      placeholder: |
        What feature would you like to see?

        How would it improve the game?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Details
      description: Optional — provide examples, screenshots, mockups, or any other details.
      placeholder: Add any additional information here.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact
      description: Optional — provide an email, Discord username, or other way to contact you.
      placeholder: "example@email.com"
    validations:
      required: false
