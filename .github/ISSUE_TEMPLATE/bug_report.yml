name: Report a Bug
description: Report a bug or unexpected behavior in Undercover.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe what happened and what you expected to happen.
      placeholder: |
        What happened?

        What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps to reproduce the issue (e.g. player count, game phase, browser/device).
      placeholder: |
        1. Start a lobby with 5 players
        2. Enter the clue phase
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether this occurred on a hosted deployment or local development.
      placeholder: "Chrome 130 on macOS, local dev"
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or Console Output
      description: Optional - attach a screenshot, screen recording, or console error output that helps explain the issue.
      placeholder: Drag and drop your screenshot or paste console logs here.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact
      description: Optional - provide an email, Discord username, or other way to contact you if we need more information.
      placeholder: "example@email.com"
    validations:
      required: false
