name: 🐛 Report a Bug
description: Report a bug or unexpected behavior in Undercover.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Please describe what went wrong and what you expected to happen.
      placeholder: |
        What happened?

        What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional — attach a screenshot or screen recording that helps explain the issue.
      placeholder: Drag and drop your screenshot or screen recording here.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact
      description: Optional — provide an email, Discord username, or other way to contact you if we need more information.
      placeholder: "example@email.com"
    validations:
      required: false
